# api.mzizi.dev — the Mzizi registry API, as a pure-Rust Cloudflare Worker.
#
# WHY THIS EXISTS
#
# The registry API is served today by Next.js route handlers in mzizi-dev/mzizi,
# running on Vercel at `mzizi.dev/api/v1`. `api.mzizi.dev` is the address the
# ecosystem already writes down — mzizi-console pointed at it, and had to be
# corrected because the host has no DNS record at all. This Worker is what makes
# that address real.
#
# WHY workers-rs AND NOT AN IN-HOUSE FRAMEWORK
#
# There is no in-house HTTP framework to use. `mzizi-rs/crates/*` are UI and
# assurance layers (N1, N2, N7-N11) — none of them serves HTTP. `mzizi-lang` is
# Phase 0 research: its own README says the front end is a prototype, contract
# bodies parse but are not evaluated, and nothing has been measured against the
# charter's kill criteria. An API gateway is the wrong first production load for
# it.
#
# `workers-rs` is the Cloudflare-maintained Rust SDK, and the DNA architecture
# doc already names it as the target runtime for the fundi rung. Using it here
# is consistent with a decision the ecosystem already recorded.
[package]
name = "mzizi-api-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/mzizi-dev/mzizi-api-gateway"
homepage = "https://api.mzizi.dev"
description = "The Mzizi registry API — a pure-Rust Cloudflare Worker."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# The Worker ships as WASM; size is a deploy constraint, not a preference.
opt-level = "z"
lto = true
codegen-units = 1

# NOT `strip = true`. That is an alias for `strip = "symbols"`, which makes rustc
# pass `--strip-all` to wasm-ld, and wasm-ld's `--strip-all` skips writing three
# synthetic custom sections: `name`, `producers`, and `target_features`.
#
# Losing `target_features` is the fatal one. It is where the module advertises
# `reference-types`, and that advertisement is the ONLY signal wasm-bindgen uses
# to decide whether to run its externref transform. Stripped, the transform is
# silently skipped, no externref table is emitted, and the build dies late with
# an error that names neither `strip` nor `target_features`:
#
#     error: failed to generate catch wrappers
#     Caused by: externref table required for catch wrappers
#
# The `catch` wrappers it cannot generate are not optional for us: worker-build
# invokes wasm-bindgen with `--force-enable-abort-handler`, so every workers-rs
# build takes this path. Upstream knows — cloudflare/workers-rs#1014 and
# wasm-bindgen#5205 — but as of writing neither fix has shipped, so the profile
# is what has to change.
#
# `"debuginfo"` maps to `--strip-debug`, which drops the `.debug_*` sections and
# leaves the other three alone. It is also the right setting on its own merits:
# `observability` is on in wrangler.jsonc, and the `name` section that
# `strip = true` was discarding is what turns a stack trace in those logs into
# function names instead of indices. worker-build already takes this view — it
# passes `--debuginfo` to wasm-opt specifically to keep the names section.
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
