name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    # Not just main. Stacked pull requests target the branch below them in the
    # stack, and a filter of [main] silently gives every layer but the bottom
    # one zero checks — a green PR with nothing run looks identical to a
    # passing one.
    branches: [main, staging, "claude/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Clones mzizi-registry at the ref pinned in scripts/registry-ref.json and
      # generates src/data/. Everything below reads it.
      - run: npm run build:data

      # tsc over the tsconfig program (src/, test/), as before.
      - run: npm run typecheck

      # vp check: oxfmt + oxlint + type-aware lint and type check, the org's
      # Vite+ standard (replaces the old prettier format:check).
      - run: npm run check

      - run: npm test

      # The real artefact: wrangler's own bundle of the Worker, the same step
      # Cloudflare Workers Builds runs (including the custom build in
      # wrangler.jsonc). Fails here if the bundle is over the size limit or the
      # config is invalid — except routes, which a dry run does not validate.
      - name: wrangler deploy --dry-run
        run: npx wrangler deploy --dry-run --outdir=.wrangler/dryrun

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The gitleaks/gitleaks-action wrapper requires a paid licence for org
      # repos. The binary is MIT-licensed, so it runs directly and stays free.
      - name: Install gitleaks
        env:
          VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSL --fail -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - run: gitleaks detect --source . --redact --no-banner --verbose
